<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Verified Repair Agent{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <div class="wrap">
    <header class="site">
      <div>
        <p class="kicker">Recorded runs</p>
        <a class="wordmark" href="/">Verified Repair Agent</a>
      </div>
      <nav>
        <a href="/comparison">Comparison</a>
        <a href="{{ source_url }}">Source</a>
      </nav>
    </header>
    <p class="banner">{{ recorded_line }}</p>
    {% if demo_note %}
    <p class="demo">{{ demo_note }}</p>
    {% endif %}
    {% block body %}{% endblock %}
  </div>
</body>
</html>
